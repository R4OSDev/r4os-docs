<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="2770" role="img" aria-labelledby="diagram-title diagram-desc" preserveAspectRatio="none">
  <title id="diagram-title">R4OS API-Architektur</title>
  <desc id="diagram-desc">Aktueller Aufruf-, Lade- und Buildpfad fuer normale Zig- und C-Anwendungen.</desc>
  <defs>
    <marker id="arrow-runtime" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#174d75"/></marker>
    <marker id="arrow-provision" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#68449a"/></marker>
    <marker id="arrow-build" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#72520b"/></marker>
    <style><![CDATA[
      text { font-family: Segoe UI, Arial, sans-serif; fill: #15202b; font-size: 13px; }
      .section-title { font-size: 19px; font-weight: 700; fill: #102a43; }
      .note, .legend { font-size: 12px; font-weight: 600; fill: #334e68; }
      .node { stroke: #243b53; stroke-width: 1.6; vector-effect: non-scaling-stroke; rx: 8; }
      .app { fill: #e3f2fd; } .sdk { fill: #e8f5e9; } .facade { fill: #fff8e1; }
      .abi { fill: #f3e5f5; stroke-width: 2.4; } .loader { fill: #ede7f6; }
      .table { fill: #e1f5fe; } .library { fill: #fce4ec; stroke-dasharray: 7 4; }
      .kernel { fill: #eceff1; stroke-width: 2.2; } .trace { fill: #fffde7; }
      .build { fill: #fff3e0; } .artifact { fill: #f1f8e9; }
      .boundary { fill: none; stroke: #596b7a; stroke-width: 2; stroke-dasharray: 10 6; vector-effect: non-scaling-stroke; }
      .boundary-label { font-size: 12px; font-weight: 700; fill: #394b59; }
      .edge { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; }
      .edge.runtime { stroke: #174d75; marker-end: url(#arrow-runtime); }
      .edge.provision { stroke: #68449a; stroke-dasharray: 8 5; marker-end: url(#arrow-provision); }
      .edge.library { stroke: #9c4668; stroke-dasharray: 3 4; marker-end: url(#arrow-runtime); }
      .edge.trace { stroke: #174d75; stroke-width: 3; marker-end: url(#arrow-runtime); }
      .edge.build { stroke: #72520b; stroke-dasharray: 2 5; marker-end: url(#arrow-build); }
      .edge-label { font-size: 11px; font-weight: 600; fill: #334e68; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
  <text id="runtime_title" class="section-title" x="4%" y="46">1. Laufzeit: App bis Kernel</text>
  <text id="ownership_note" class="note" x="6%" y="410">App owns; Kontext und Tabellen borrowed.</text>
  <text id="trace_title" class="section-title" x="4%" y="1235">2. Dateispur: Datei lesen</text>
  <text id="build_title" class="section-title" x="4%" y="2015">3. Bauen und Laden</text>
  <text id="legend_title" class="legend" x="4%" y="2720">Legende: durchgezogen = Laufzeit | gestrichelt = Laden</text>
  <text id="legend_more" class="legend" x="4%" y="2742">gepunktet = Build | nummeriert = Dateispur</text>
  <g id="lowlevel_boundary">
    <rect class="boundary" x="4%" y="420" width="92%" height="740" rx="12"/>
    <text class="boundary-label" x="6%" y="440">Low-Level-/ABI-Grenze</text>
  </g>
  <g id="kernel_boundary">
    <rect class="boundary" x="4%" y="900" width="92%" height="260" rx="12"/>
    <text class="boundary-label" x="6%" y="920">Kernel</text>
  </g>
  <g id="runtime_1">
    <line class="edge runtime" x1="50%" y1="162" x2="50%" y2="200"/>
    <text class="edge-label" text-anchor="middle" x="50%" y="176">Start</text>
  </g>
  <g id="runtime_2">
    <line class="edge runtime" x1="50%" y1="272" x2="50%" y2="310"/>
    <text class="edge-label" text-anchor="middle" x="50%" y="286">App erzeugen</text>
  </g>
  <g id="runtime_3">
    <line class="edge runtime" x1="50%" y1="392" x2="50%" y2="465"/>
    <text class="edge-label" text-anchor="middle" x="50%" y="423.5">Bundle nutzen</text>
  </g>
  <g id="provision_1">
    <line class="edge provision" x1="28%" y1="610" x2="28%" y2="555"/>
    <text class="edge-label" text-anchor="middle" x="28%" y="577.5">Loader provisioniert</text>
  </g>
  <g id="runtime_tables">
    <line class="edge runtime" x1="72%" y1="555" x2="72%" y2="610"/>
    <text class="edge-label" text-anchor="middle" x="72%" y="577.5">direkter Aufruf</text>
  </g>
  <g id="library_1">
    <line class="edge library" x1="28%" y1="730" x2="28%" y2="770"/>
    <text class="edge-label" text-anchor="middle" x="28%" y="745">Librarycode</text>
  </g>
  <g id="provider_tables">
    <line class="edge runtime" x1="72%" y1="890" x2="50%" y2="950"/>
  </g>
  <g id="provider_subsystem">
    <line class="edge runtime" x1="50%" y1="1032" x2="50%" y2="1060"/>
  </g>
  <g id="trace_1">
    <line class="edge trace" x1="50%" y1="1372" x2="50%" y2="1400"/>
  </g>
  <g id="trace_2">
    <line class="edge trace" x1="50%" y1="1482" x2="50%" y2="1510"/>
  </g>
  <g id="trace_3">
    <line class="edge trace" x1="50%" y1="1592" x2="50%" y2="1620"/>
  </g>
  <g id="trace_4">
    <line class="edge trace" x1="50%" y1="1702" x2="50%" y2="1730"/>
  </g>
  <g id="trace_5">
    <line class="edge trace" x1="50%" y1="1812" x2="50%" y2="1840"/>
  </g>
  <g id="build_1">
    <line class="edge build" x1="50%" y1="2142" x2="50%" y2="2180"/>
  </g>
  <g id="build_2">
    <line class="edge build" x1="50%" y1="2262" x2="50%" y2="2290"/>
  </g>
  <g id="build_3">
    <line class="edge build" x1="50%" y1="2362" x2="50%" y2="2400"/>
  </g>
  <g id="build_4">
    <line class="edge build" x1="50%" y1="2472" x2="50%" y2="2510"/>
  </g>
  <g id="build_5">
    <line class="edge build" x1="50%" y1="2592" x2="50%" y2="2620"/>
  </g>
  <g id="app_source">
    <rect class="node app" x="8%" y="90" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="121">Zig- oder C-Anwendung</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="141">schreibt r4_app_main(App*)</text>
  </g>
  <g id="sdk_startup">
    <rect class="node sdk" x="8%" y="200" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="231">SDK-eigener R4XStart:1-Startup</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="251">validiert Kontext und App-Profil</text>
  </g>
  <g id="app_facade">
    <rect class="node facade" x="8%" y="310" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="336">App-/R4App-Fassade und SDK-Wrapper</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="356">besitzen das Bundle</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="376">pruefen Gruppe, Feld und Vertrag</text>
  </g>
  <g id="r4x_context">
    <rect class="node abi" x="8%" y="465" width="84%" height="90"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="495">R4XStartContext mit Import-Bundle</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="515">Kontext ist fuer den Startaufruf borrowed</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="535">Tabellenzeiger bleiben Kernel-owned</text>
  </g>
  <g id="r4l_query">
    <rect class="node loader" x="8%" y="610" width="40%" height="120"/>
    <text text-anchor="middle" font-weight="700" x="28%" y="625">R4LQuery</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="645">beim Laden</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="665">loest Gruppen-</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="685">importe auf</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="705">kein Laufzeit-</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="725">Dispatcher</text>
  </g>
  <g id="runtime_libraries">
    <rect class="node library" x="8%" y="770" width="40%" height="120"/>
    <text text-anchor="middle" font-weight="700" x="28%" y="795">Runtime-R4Ls</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="815">R4STD, R4IMG, R4FONT</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="835">lokaler Contract</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="855">eigene API-Tabellen</text>
    <text text-anchor="middle" font-weight="400" x="28%" y="875">keine Kernel-Gruppe</text>
  </g>
  <g id="kernel_tables">
    <rect class="node table" x="52%" y="610" width="40%" height="280"/>
    <text text-anchor="middle" font-weight="700" x="72%" y="695">6 Kernel-Tabellen</text>
    <text text-anchor="middle" font-weight="400" x="72%" y="715">R4SYS</text>
    <text text-anchor="middle" font-weight="400" x="72%" y="735">R4DESK</text>
    <text text-anchor="middle" font-weight="400" x="72%" y="755">R4DRAW</text>
    <text text-anchor="middle" font-weight="400" x="72%" y="775">R4NET</text>
    <text text-anchor="middle" font-weight="400" x="72%" y="795">R4AUDIO</text>
    <text text-anchor="middle" font-weight="400" x="72%" y="815">R4DEV</text>
  </g>
  <g id="kernel_providers">
    <rect class="node kernel" x="8%" y="950" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="976">Sechs typisierte Kernel-Provider</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="996">direkte Funktionszeiger</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1016">kein Syscall- oder Dispatch-Zwischenweg</text>
  </g>
  <g id="kernel_subsystems">
    <rect class="node kernel" x="8%" y="1060" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1081">Kernel-Subsysteme</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1101">FS, Desktop, Draw, Network</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1121">Audio und Device</text>
  </g>
  <g id="trace_facade">
    <rect class="node trace" x="8%" y="1290" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1316">1  App-Fassade</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1336">app.files().read</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1356">Pfad plus caller-owned Buffer</text>
  </g>
  <g id="trace_sdk">
    <rect class="node trace" x="8%" y="1400" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1426">2  R4SYS-SDK-Wrapper</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1446">ruft file_read-Zeiger</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1466">aus der Gruppentabelle direkt auf</text>
  </g>
  <g id="trace_provider">
    <rect class="node trace" x="8%" y="1510" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1536">3  Kernel-Provider in program/r4x.zig</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1556">apiFileRead -&gt; Async-I/O</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1576">weiter zu program/r4sys.zig</text>
  </g>
  <g id="trace_fs_request">
    <rect class="node trace" x="8%" y="1620" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1646">4  Technische FS-Request-Schicht</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1666">fs/request.zig</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1686">koordiniert den Zugriff</text>
  </g>
  <g id="trace_vfs">
    <rect class="node trace" x="8%" y="1730" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1756">5  FS-neutrale VFS-Schicht</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1776">fs/vfs.zig dispatcht</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1796">an das Dateisystem des Laufwerks</text>
  </g>
  <g id="trace_fat32">
    <rect class="node trace" x="8%" y="1840" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="1866">6  FS-Backend des Laufwerks</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1886">ntfs.zig fuer C:, fat32.zig fuer D:</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="1906">liest in den Buffer des Aufrufers</text>
  </g>
  <g id="manifest_source">
    <rect class="node build" x="8%" y="2070" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="2101">module.R4MF v2 plus Zig-/C-Quellen</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2121">Profil, Imports, Ziel und Einstieg</text>
  </g>
  <g id="compiler_linker">
    <rect class="node build" x="8%" y="2180" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="2206">SDK-Buildprofil, Compiler und Linker</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2226">binden Startup und ABI</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2246">sowie deklarierte R4L-Imports</text>
  </g>
  <g id="r4x_builder">
    <rect class="node build" x="8%" y="2290" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="2321">R4XBuilder</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2341">verpackt Code, Daten, Imports und Metadaten</text>
  </g>
  <g id="r4m0_artifact">
    <rect class="node artifact" x="8%" y="2400" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="2431">R4M0-Container als .R4X</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2451">current-only Modul- und Startvertrag</text>
  </g>
  <g id="kernel_loader">
    <rect class="node loader" x="8%" y="2510" width="84%" height="82"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="2536">Kernel-Loader</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2556">validiert, laedt und reloziert</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2576">baut den R4XStartContext</text>
  </g>
  <g id="app_entry">
    <rect class="node app" x="8%" y="2620" width="84%" height="72"/>
    <text text-anchor="middle" font-weight="700" x="50%" y="2651">SDK R4XStart -&gt; r4_app_main</text>
    <text text-anchor="middle" font-weight="400" x="50%" y="2671">Anwendung laeuft mit ihrem App-Objekt</text>
  </g>
</svg>
